name: LineageOS sepolicy check

on:
  workflow_dispatch:
    inputs:
      sepolicy_url:
        description: 'sepolicy バイナリの直リンク'
        required: true
        type: string
      target_name:
        description: '出力ファイル名の接頭辞'
        required: false
        default: 'device'
        type: string

env:
  MANIFEST_URL: 'https://github.com/LineageOS/android'
  MANIFEST_BRANCH: 'cm-12.1'
  DEVICE_NAME: 'a03br'
  MAKEFILE_NAME: 'cm_a03br'
  TARGET: ${{ github.event.inputs.target_name }}
  WORKSPACE: ${{ github.workspace }}/workspace

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Display Run Parameters
        run: |
          echo "::group::User Environment Variables"
          echo "Manifest URL: ${{ env.MANIFEST_URL }}"
          echo "Manifest Branch: ${{ env.MANIFEST_BRANCH }}"
          echo "Device Name: ${{ env.DEVICE_NAME }}"
          echo "Makefile Name: ${{ env.MAKEFILE_NAME }}"
          echo "sepolicy URL: ${{ github.event.inputs.sepolicy_url }}"
          echo "Target Name: ${{ env.TARGET }}"
          echo "::endgroup::"

      - name: Check Out
        uses: actions/checkout@v3

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Prepare the environment
        run: |
          sudo apt update
          sudo apt -y install \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree \
            lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush \
            schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp \
            qemu-user-static libstdc++-10-dev libncurses5 python3 libtinfo5 \
            libssl-dev bsdmainutils zip unzip wget

      - name: Install OpenJDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '7'

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize repo
        id: pwd
        run: |
          mkdir -p ${{ env.WORKSPACE }}
          cd ${{ env.WORKSPACE }}
          echo "workspace-folder=$(pwd)" >> "$GITHUB_OUTPUT"
          git config --global user.name "azwhikaru"
          git config --global user.email "azwhikaru+37921907@github.com"
          repo init --depth=1 -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }}

      - name: Create Local Manifest
        run: |
          mkdir -p ${{ env.WORKSPACE }}/.repo/local_manifests
          cat << 'EOF' > ${{ env.WORKSPACE }}/.repo/local_manifests/roomservice.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
              <project name="coara-chocomaru/ct2-br" path="device/sts/a03br" remote="github" revision="main" />
              <project name="coara-chocomaru/a03-br_vendor_blob" path="vendor/sts/a03br" remote="github" revision="main" />
          </manifest>
          EOF

      - name: Repo Sync
        working-directory: ${{ env.WORKSPACE }}
        run: |
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Fetch Git LFS files for all repositories
        working-directory: ${{ env.WORKSPACE }}
        run: |
          repo forall -v -c git lfs pull

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build secilc host tool
        working-directory: ${{ env.WORKSPACE }}
        run: |
          source build/envsetup.sh
          lunch aosp_arm-eng || lunch full-eng || true
          make secilc -j$(nproc)

      - name: Download sepolicy binary
        working-directory: ${{ env.WORKSPACE }}
        run: |
          wget -O sepolicy "${{ github.event.inputs.sepolicy_url }}"
          if [ ! -s sepolicy ]; then
            echo "ERROR: ダウンロード失敗" >&2
            exit 1
          fi
          file sepolicy

      - name: Convert to policy.conf and policy.cil
        working-directory: ${{ env.WORKSPACE }}
        run: |
          checkpolicy -b -o policy.conf sepolicy
          checkpolicy -b -C -o policy.cil sepolicy || echo "CIL 変換失敗 (checkpolicy -C 非対応)"

      - name: Validate with secilc (if CIL available)
        working-directory: ${{ env.WORKSPACE }}
        run: |
          if [ -f policy.cil ]; then
            out/host/linux-x86/bin/secilc -c policy.cil -o /dev/null || echo "secilc 検証エラー (無視)"
          fi

      - name: Multi-angle Python parsing
        working-directory: ${{ env.WORKSPACE }}
        run: |
          python3 << 'PYEOF'
          import re, os, sys
          from collections import defaultdict

          def parse_cil(cil_path):
              with open(cil_path, 'r', encoding='utf-8', errors='ignore') as f:
                  data = f.read()
              pattern = r'\([^()]*(?:\([^()]*\)[^()]*)*\)'
              tokens = re.findall(pattern, data, re.DOTALL)
              if not tokens:
                  tokens = [line.strip() for line in data.splitlines() if line.strip() and not line.startswith('#')]
              result = {'types':set(), 'attrs':set(), 'allow':[], 'dontaudit':[], 'auditallow':[],
                        'type_trans':[], 'filecon':[], 'propertycon':[], 'servicecon':[]}
              for tok in tokens:
                  tok = tok.strip()
                  if tok.startswith('(') and tok.endswith(')'):
                      tok = tok[1:-1].strip()
                  parts = tok.split(maxsplit=1)
                  if not parts:
                      continue
                  kw = parts[0]
                  args = parts[1] if len(parts)>1 else ''
                  if kw == 'type':
                      m = re.match(r'(\w+)', args)
                      if m:
                          result['types'].add(m.group(1))
                  elif kw == 'attribute':
                      m = re.match(r'(\w+)', args)
                      if m:
                          result['attrs'].add(m.group(1))
                  elif kw in ('allow','dontaudit','auditallow'):
                      elems = re.split(r'\s+', args)
                      if len(elems) >= 4:
                          src, tgt = elems[0], elems[1]
                          cls_perm = ' '.join(elems[2:])
                          cls_perm = re.sub(r'[()]', '', cls_perm)
                          cp = cls_perm.split()
                          if cp:
                              cls = cp[0]
                              perms = cp[1:] if len(cp)>1 else []
                              if perms:
                                  rule = (src, tgt, cls, ' '.join(perms))
                                  if kw == 'allow':
                                      result['allow'].append(rule)
                                  elif kw == 'dontaudit':
                                      result['dontaudit'].append(rule)
                                  elif kw == 'auditallow':
                                      result['auditallow'].append(rule)
                  elif kw == 'type_transition':
                      parts2 = args.split()
                      if len(parts2) == 4:
                          result['type_trans'].append(tuple(parts2))
                  elif kw == 'filecon':
                      m = re.search(r'^(\S+)\s+(\S+)?\s*\(([^)]+)\)', args)
                      if m:
                          path = m.group(1)
                          ctx = m.group(3) if m.group(2) is None else m.group(2)
                          result['filecon'].append((path, ctx))
                  elif kw == 'propertycon':
                      parts2 = args.split()
                      if len(parts2) >= 2:
                          result['propertycon'].append((parts2[0], parts2[1]))
                  elif kw == 'servicecon':
                      parts2 = args.split()
                      if len(parts2) >= 2:
                          result['servicecon'].append((parts2[0], parts2[1]))
              return result

          def parse_conf(conf_path):
              with open(conf_path, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()
              result = {'types':set(), 'attrs':set(), 'allow':[], 'dontaudit':[], 'auditallow':[],
                        'type_trans':[], 'filecon':[], 'propertycon':[], 'servicecon':[]}
              patterns = {
                  'type': re.compile(r'^type\s+(\w+)\s*;'),
                  'attr': re.compile(r'^attribute\s+(\w+)\s*;'),
                  'allow': re.compile(r'^allow\s+([\w]+)\s+([\w\{\}]+)\s*:\s*(\w+)\s+([\w\{\}]+)\s*;'),
                  'dontaudit': re.compile(r'^dontaudit\s+([\w]+)\s+([\w\{\}]+)\s*:\s*(\w+)\s+([\w\{\}]+)\s*;'),
                  'auditallow': re.compile(r'^auditallow\s+([\w]+)\s+([\w\{\}]+)\s*:\s*(\w+)\s+([\w\{\}]+)\s*;'),
                  'type_trans': re.compile(r'^type_transition\s+([\w]+)\s+([\w\{\}]+)\s*:\s*(\w+)\s+([\w]+)\s*;'),
                  'filecon': re.compile(r'^filecon\s+([^\s]+)\s+(\w+)?\s*\(\s*([^)]+)\s*\)\s*;'),
                  'propertycon': re.compile(r'^propertycon\s+([^\s]+)\s+([^\s]+)\s*;'),
                  'servicecon': re.compile(r'^servicecon\s+([^\s]+)\s+([^\s]+)\s*;')
              }
              for line in lines:
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  for k, pat in patterns.items():
                      m = pat.match(line)
                      if m:
                          if k == 'type':
                              result['types'].add(m.group(1))
                          elif k == 'attr':
                              result['attrs'].add(m.group(1))
                          elif k == 'allow':
                              result['allow'].append((m.group(1), m.group(2), m.group(3), m.group(4)))
                          elif k == 'dontaudit':
                              result['dontaudit'].append((m.group(1), m.group(2), m.group(3), m.group(4)))
                          elif k == 'auditallow':
                              result['auditallow'].append((m.group(1), m.group(2), m.group(3), m.group(4)))
                          elif k == 'type_trans':
                              result['type_trans'].append((m.group(1), m.group(2), m.group(3), m.group(4)))
                          elif k == 'filecon':
                              path = m.group(1)
                              ctx = m.group(3) if m.group(2) is None else m.group(2)
                              result['filecon'].append((path, ctx))
                          elif k == 'propertycon':
                              result['propertycon'].append((m.group(1), m.group(2)))
                          elif k == 'servicecon':
                              result['servicecon'].append((m.group(1), m.group(2)))
                          break
              return result

          def write_output(data, prefix):
              with open(f'{prefix}_types.txt', 'w') as f:
                  for t in sorted(data['types']):
                      f.write(f'type {t};\n')
              with open(f'{prefix}_attributes.txt', 'w') as f:
                  for a in sorted(data['attrs']):
                      f.write(f'attribute {a};\n')
              with open(f'{prefix}_all_allow_rules.txt', 'w') as f:
                  for r in data['allow']:
                      f.write(f'allow {r[0]} {r[1]} : {r[2]} {{ {r[3]} }};\n')
              domain_rules = defaultdict(list)
              for r in data['allow'] + data['dontaudit'] + data['auditallow']:
                  src = r[0]
                  domain_rules[src].append(r)
              os.makedirs('te_files', exist_ok=True)
              for dom, rules in domain_rules.items():
                  with open(f'te_files/{dom}.te', 'w') as f:
                      f.write(f'# {dom}\n')
                      for r in rules:
                          f.write(f'allow {r[0]} {r[1]} : {r[2]} {{ {r[3]} }};\n')
              with open(f'{prefix}_file_contexts', 'w') as f:
                  for path, ctx in data['filecon']:
                      f.write(f'{path} {ctx}\n')
              with open(f'{prefix}_property_contexts', 'w') as f:
                  for name, ctx in data['propertycon']:
                      f.write(f'{name} {ctx}\n')
              with open(f'{prefix}_service_contexts', 'w') as f:
                  for name, ctx in data['servicecon']:
                      f.write(f'{name} {ctx}\n')
              with open(f'{prefix}_type_transitions.txt', 'w') as f:
                  for r in data['type_trans']:
                      f.write(f'type_transition {r[0]} {r[1]} : {r[2]} {r[3]};\n')

          if __name__ == '__main__':
              data = {}
              if os.path.exists('policy.cil'):
                  data = parse_cil('policy.cil')
                  if not data['types']:
                      data = parse_conf('policy.conf')
              else:
                  data = parse_conf('policy.conf')
              if not data['types']:
                  print("警告: 解析結果が空です。policy.conf の内容を確認してください。")
              write_output(data, '${{ env.TARGET }}')
              print(f"解析完了: types={len(data['types'])}, allow={len(data['allow'])}")
          PYEOF

      - name: Create ZIP archive
        working-directory: ${{ env.WORKSPACE }}
        run: |
          ZIP_NAME="${{ env.TARGET }}_sepolicy_analysis.zip"
          zip -r "$ZIP_NAME" *.txt *.te *_contexts te_files/ policy.conf policy.cil 2>/dev/null || true
          echo "ZIP_FILE=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sepolicy-analysis-${{ env.TARGET }}-${{ github.run_id }}
          path: ${{ env.WORKSPACE }}/${{ env.ZIP_FILE }}
          retention-days: 14
          if-no-files-found: error
